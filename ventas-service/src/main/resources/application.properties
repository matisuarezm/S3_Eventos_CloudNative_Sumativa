spring.application.name=ventas-service
server.port=${SERVER_PORT:8082}

# URL interna de eventos-service (en Docker Compose: http://eventos-service:8081)
eventos.url=${EVENTOS_URL:http://localhost:8081}

# --- Base de datos: Oracle Cloud (Autonomous Database) ---
# Los valores llegan por variables de entorno; nunca se escriben aqui.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# Hibernate crea/actualiza la tabla COMPRAS automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Semana 2: Amazon S3 (resumenes de compra) ---
# Bucket y region del Learner Lab. Las credenciales son temporales y llegan por variables de entorno.
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:us-east-1}
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.aws.session-token=${AWS_SESSION_TOKEN:}

# --- Semana 3: Amazon EFS (almacenamiento temporal de tickets) ---
# En la EC2 el EFS esta montado en /mnt/efs y Docker lo monta en el contenedor en /app/efs.
# Localmente (sin EFS) se usa la carpeta ./data/efs.
app.efs.path=${EFS_PATH:./data/efs}

# Tamano maximo de archivos subidos (reemplazo del resumen)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
