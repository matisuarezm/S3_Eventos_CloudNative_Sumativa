spring.application.name=ventas-service
server.port=${SERVER_PORT:8082}

# URL interna de eventos-service (en Docker Compose: http://eventos-service:8081)
eventos.url=${EVENTOS_URL:http://localhost:8081}

# --- Base de datos: Oracle Cloud (Autonomous Database) ---
# Los valores llegan por variables de entorno; nunca se escriben aqui.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# Hibernate crea/actualiza la tabla COMPRAS automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
