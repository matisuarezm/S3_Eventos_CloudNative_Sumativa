spring.application.name=eventos-service
server.port=${SERVER_PORT:8081}

# --- Base de datos: Oracle Cloud (Autonomous Database) ---
# Los valores llegan por variables de entorno; nunca se escriben aqui.
# DB_URL = "jdbc:oracle:thin:@" + cadena TLS copiada desde OCI (ver README, paso 1)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# Hibernate crea/actualiza las tablas EVENTOS automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Eventos de ejemplo si la tabla esta vacia
app.datos-iniciales=${APP_DATOS_INICIALES:true}

# Actuator: solo health e info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
