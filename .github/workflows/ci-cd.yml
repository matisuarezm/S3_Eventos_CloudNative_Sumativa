name: CI/CD Eventos

# push a main  -> pruebas + imagen en Docker Hub + despliegue en EC2
# pull request -> solo pruebas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Evita dos despliegues simultaneos sobre la misma EC2
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Compila y ejecuta las pruebas automaticas (H2 en memoria)
  test:
    name: Pruebas ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [eventos-service, ventas-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: mvn verify
        run: mvn -B -ntp -f ${{ matrix.service }}/pom.xml verify

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  # 2) Construye la imagen Docker de cada microservicio y la publica en Docker Hub
  docker:
    name: Imagen ${{ matrix.service }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [eventos-service, ventas-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 3) Copia compose.yml a la EC2 y levanta la version recien publicada
  deploy:
    name: Despliegue en EC2
    if: github.event_name != 'pull_request'
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar compose.yml a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: compose.yml
          target: ~/eventos-app

      - name: Levantar contenedores
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,DB_URL,DB_USERNAME,DB_PASSWORD
          command_timeout: 15m
          script: |
            set -e
            cd ~/eventos-app
            # Archivo .env con la configuracion (solo vive en la EC2, nunca en GitHub)
            umask 077
            {
              echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "DB_URL='$DB_URL'"
              echo "DB_USERNAME='$DB_USERNAME'"
              echo "DB_PASSWORD='$DB_PASSWORD'"
            } > .env
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans --wait --wait-timeout 300
            docker compose ps
            docker image prune -f
