# Despliegue de los dos microservicios en la instancia EC2.
# Las variables (${...}) se leen del archivo .env que el pipeline crea en la EC2.
services:
  eventos-service:
    image: ${DOCKERHUB_USERNAME}/eventos-service:${IMAGE_TAG:-latest}
    container_name: eventos-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    mem_limit: 450m
    volumes:
      - ./wallet:/app/wallet:ro   # <-- nuevo: wallet de Oracle (solo lectura)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ventas-service:
    image: ${DOCKERHUB_USERNAME}/ventas-service:${IMAGE_TAG:-latest}
    container_name: ventas-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      EVENTOS_URL: http://eventos-service:8081
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Semana 2: Amazon S3 para los resumenes de compra
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      # Semana 3: carpeta donde el contenedor ve el EFS (almacenamiento temporal de tickets)
      EFS_PATH: /app/efs
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    mem_limit: 450m
    volumes:
      - ./wallet:/app/wallet:ro   # wallet de Oracle (solo lectura)
      - /mnt/efs:/app/efs         # Semana 3: EFS montado en la EC2 -> /app/efs en el contenedor
    depends_on:
      eventos-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s